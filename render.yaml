# Render Blueprint: backend web service and frontend static site.
#
# All data is stored as files under DATA_DIR. Render's free plan has no persistent disk, so data is
# reset whenever the service restarts or redeploys. To keep data, switch the API to `plan: starter`
# (or higher) and uncomment the `disk` block. Embeddings are off on the free plan (512 MB RAM); the
# keyword retriever is used and agents and page citations are unchanged.
services:
  - type: web
    name: cte-system-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # disk:
    #   name: cte-data
    #   mountPath: /app/data
    #   sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN    # comma-separated; add a Vercel URL here if you also deploy there
        value: https://cte-system-app.onrender.com,http://localhost:5173
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDINGS_ENABLED
        value: "false"
      - key: DATA_DIR
        value: /app/data

  - type: web
    name: cte-system-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cte-system-api.onrender.com
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
